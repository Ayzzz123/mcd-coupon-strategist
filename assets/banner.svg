<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="麦麦省钱助手 - 麦当劳点餐成本助手">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0d08"/>
      <stop offset="55%" stop-color="#2b1108"/>
      <stop offset="100%" stop-color="#140806"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFC72C"/>
      <stop offset="100%" stop-color="#FF8A00"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DA291C"/>
      <stop offset="100%" stop-color="#9E1B12"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <circle cx="1060" cy="70" r="230" fill="#DA291C" opacity="0.14"/>
  <circle cx="130" cy="380" r="200" fill="#FFC72C" opacity="0.09"/>

  <!-- 金色拱门（Golden Arches）
       识别要点（关键）：
       1. 内缝只下探约 45% 高度，且**缝底是圆头**（U 形），不是尖角；
       2. 两条腿在缝下合并为一根粗柱；
       3. 缝宽 20，两拱间隙 20，两者接近 —— 但不能相等，否则读成 "nn"。
       基准区 0..240 × 0..180，再整体缩放平移。 -->
  <g transform="translate(58,116) scale(0.82,0.82)" filter="url(#glow)">
    <!-- 左拱：外缘升 → 半圆顶 → 内缘降 → 圆底浅缝 → 内缘升 → 右腿降 -->
    <path d="M0 180
             L0 58
             C0 18 24 -6 55 -6
             C86 -6 110 18 110 58
             L110 180
             L70 180
             L70 104
             C70 54 64 30 55 30
             C46 30 40 54 40 104
             L40 180
             Z"
          fill="url(#gold)"/>
    <!-- 右拱（关于 x=120 镜像） -->
    <path d="M240 180
             L240 58
             C240 18 216 -6 185 -6
             C154 -6 130 18 130 58
             L130 180
             L170 180
             L170 104
             C170 54 176 30 185 30
             C194 30 200 54 200 104
             L200 180
             Z"
          fill="url(#gold)"/>
  </g>

  <!-- 标题 -->
  <text x="360" y="168" font-family="'PingFang SC','Microsoft YaHei',-apple-system,sans-serif"
        font-size="66" font-weight="700" fill="#FFFFFF" letter-spacing="2">麦麦省钱助手</text>
  <text x="362" y="220" font-family="'Menlo','Consolas',monospace"
        font-size="26" fill="#FFC72C" letter-spacing="1.5">mcd-coupon-strategist</text>

  <!-- 分隔线 -->
  <rect x="362" y="248" width="150" height="4" rx="2" fill="url(#gold)"/>

  <!-- 副标题 -->
  <text x="362" y="300" font-family="'PingFang SC','Microsoft YaHei',sans-serif"
        font-size="30" fill="#F2E6D8">别的工具帮你省这一单，</text>
  <text x="362" y="344" font-family="'PingFang SC','Microsoft YaHei',sans-serif"
        font-size="30" font-weight="700" fill="#FFC72C">我们告诉你这一单你正在白扔多少钱。</text>

  <!-- 右上角标签 -->
  <g transform="translate(0,0)">
    <rect x="900" y="40" width="252" height="46" rx="23" fill="#DA291C" opacity="0.92"/>
    <text x="1026" y="70" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif"
          font-size="19" font-weight="600" fill="#FFFFFF">麦当劳 MCP 实时计价</text>
  </g>
</svg>
